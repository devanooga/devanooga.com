name: Ruby

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3.6
        bundler-cache: true

    - name: Build site
      run: bundle exec jekyll build
    
    - name: Run tests
      run: bundle exec rake test

    - name: Lint code
      run: bundle exec rubocop --parallel
